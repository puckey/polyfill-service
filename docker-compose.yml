services:
  polyfill:
    build:
      context: .
      args:
        # See Dockerfile: "all" or a comma-separated list like "3.111.0,3.25.1"
        POLYFILL_VERSIONS: all
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      # DEFAULT_VERSION: "5.3.1"   # serve the newest library (es2025) by default
      # DEFAULT_UNKNOWN: "ignore"  # don't build big gated bundles for bots/unknown UAs
    restart: unless-stopped
